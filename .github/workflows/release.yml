name: Release

# 发版流水线：由 CI 在 main 上创建 tag 后触发，或人工触发（须指定已存在的 tag）。
# 设计要点（对照《GHHub 最优修改报告》§12.3）：
#  1. 无 Secret 直接失败——禁止明文口令兜底（壳工程的历史教训）；
#  2. versionCode 取自 gradle.properties，不用 run_number（与语义版本不对齐）；
#  3. 三处一致校验：gradle.properties == git tag == version.json；
#  4. 制品三件套：APK / .sha256 / version.json；
#  5. 硬断言：产物存在 + 体积下限 + 签名可解析，任一不过即红。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例 v0.19.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      - name: 还原签名密钥（无 Secret 直接失败）
        env:
          KEYSTORE_B64: ${{ secrets.GHC_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.GHC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GHC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.GHC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${KEYSTORE_PASS}" ]; then
            echo "::error::缺少签名密钥 Secret（GHC_KEYSTORE_B64 / GHC_KEYSTORE_PASSWORD）。发布终止——不允许明文口令兜底。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.keystore
          chmod 600 app/release.keystore
          echo "::add-mask::$KEYSTORE_PASS"
          echo "::add-mask::$KEY_PASS"
          # 用约定插件读取的环境变量名注入（大写 GHC_*）；不要写成 Gradle 属性，
          # 那会把口令带进命令行或被跟踪的文件。
          {
            echo "GHC_KEYSTORE_PASSWORD=$KEYSTORE_PASS"
            echo "GHC_KEY_ALIAS=$KEY_ALIAS"
            echo "GHC_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: 生成 CHANGELOG（Conventional Commits → 变更日志）
        run: |
          set -euo pipefail
          VERSION=$(grep '^ghcVersionName=' gradle.properties | cut -d= -f2)
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          # 人工整理过的同名章节优先：自动生成的清单只适合"没人管"的版本，
          # 有正式版本说明时不覆盖，也不自造第二份章节。
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::notice::CHANGELOG.md 已含 [$VERSION] 章节，跳过自动生成。"
          else
            python3 tools/generate_changelog.py --version "$VERSION" --since "${PREV:-}" || true
          fi
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs(changelog): 生成 v${VERSION} 变更日志 [skip ci]"
            # main 受分支保护（要求 PR + 管理员不可绕过），直推 main 必然被拒——
            # 以前这一步会让整条发版流水线红掉。改为推到一次性分支，由人评审后并入。
            git push origin "HEAD:refs/heads/chore/changelog-v${VERSION}" || true
            echo "::notice::变更日志已推到分支 chore/changelog-v${VERSION}，请用 PR 并入 main。"
          fi

      - name: 准备 Release 说明（取 CHANGELOG 的版本章节）
        run: |
          set -euo pipefail
          VERSION=$(grep '^ghcVersionName=' gradle.properties | cut -d= -f2)
          python3 tools/release_notes.py "$VERSION" --out release-notes.md
          cat >> release-notes.md <<'FOOTER'

          ---
          - 产物三件套：APK / .sha256 / version.json
          - 安装前请校验 SHA-256；App 内安装链路另做签名证书指纹校验
          - 覆盖安装要求：applicationId 一致 + 签名一致 + versionCode 不降级
          FOOTER

      - name: 三处一致校验（gradle.properties == tag）
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          python3 tools/verify_version.py --require-tag "$TAG"

      - name: 构建签名 Release
        run: ./gradlew assembleRelease --no-daemon

      - name: 制品校验（硬断言）
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未产出 Release APK"; exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          # 体积下限是"构建是否正常"的哨兵，不是"包体该有多大"的指标。
          # 正式产物开了 R8 混淆 + 资源压缩，v0.19.0 实测约 3.5 MB；
          # 原来 5 MB 的下限是按未混淆的体积设的，会把**更小的**正常产物判为异常。
          # 下限取 2 MB：既能挡住空壳/截断的坏产物，又不与压缩后的真实体积冲突。
          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::APK 体积异常：$SIZE 字节（下限 2,000,000）"; exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if ! "$APKSIGNER" verify --print-certs "$APK" > /tmp/certs.txt 2>&1; then
            echo "::error::APK 签名校验失败（未签名或签名损坏）"; cat /tmp/certs.txt; exit 1
          fi
          # version.json.fingerprint 的真值是**签名证书** SHA-256，不是 APK 文件摘要。
          # v0.19.1 的产物曾把 fingerprint 误填成 APK 摘要（与 M0-08 的证书钉值语义不符），此处修正。
          # 解析失败必须红：不允许静默回退成文件摘要——那会让"指纹"这个字段失去校验意义。
          CERT_SHA256=$(grep -m1 'Signer #1 certificate SHA-256 digest' /tmp/certs.txt | awk '{print $NF}' | tr -d ':\r')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::无法从 apksigner 输出解析签名证书 SHA-256（fingerprint 禁止回退为 APK 摘要）"; cat /tmp/certs.txt; exit 1
          fi
          echo "APK=$APK"
          echo "SIZE=$SIZE"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          cat /tmp/certs.txt

      - name: 生成产物三件套
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$APK_PATH" "dist/github-android-client-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum "github-android-client-${GITHUB_REF_NAME}.apk" > "github-android-client-${GITHUB_REF_NAME}.apk.sha256"
          SHA=$(cut -d' ' -f1 "github-android-client-${GITHUB_REF_NAME}.apk.sha256")
          VERSION_NAME=$(grep '^ghcVersionName=' ../gradle.properties | cut -d= -f2)
          VERSION_CODE=$(grep '^ghcVersionCode=' ../gradle.properties | cut -d= -f2)
          cat > version.json <<EOF
          {
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "fingerprint": "${CERT_SHA256}",
            "sha256": "${SHA}",
            "size": $(stat -c%s "github-android-client-${GITHUB_REF_NAME}.apk"),
            "apk": "github-android-client-${GITHUB_REF_NAME}.apk",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat version.json

      - name: 三处一致校验（version.json + 签名指纹钉值）
        run: |
          set -euo pipefail
          python3 tools/verify_version.py --require-tag "${{ github.event.inputs.tag || github.ref_name }}" --version-json dist/version.json
          # 可选硬断言：仓库变量/secret 里配置了期望证书指纹时，产物必须与之逐字相等。
          # 未配置则只打印 notice——本地构建/新密钥轮换期间不阻塞，但发版时建议配置。
          if [ -n "${GHC_EXPECTED_CERT_SHA256:-}" ]; then
            if [ "${CERT_SHA256}" != "${GHC_EXPECTED_CERT_SHA256}" ]; then
              echo "::error::签名证书指纹与钉定值不一致：产物 ${CERT_SHA256} vs 期望 ${GHC_EXPECTED_CERT_SHA256}"
              exit 1
            fi
            echo "::notice::签名证书指纹与钉定值一致"
          else
            echo "::notice::未配置 GHC_EXPECTED_CERT_SHA256，跳过证书指纹钉值断言；本次产物证书指纹 = ${CERT_SHA256}"
          fi
          # 交叉校验：apksigner 的 --print-certs 文本是外部契约，正则失配时会写出**错的**指纹且不报错。
          # tools/verify_apk_cert.py 直接解析 APK 签名块（v2/v3）取证书，与上面那条 grep 是两条独立路径。
          # 两者必须给出同一个值，否则 fingerprint 字段就是不可信的。
          APK_DIST=$(ls dist/*.apk)
          python3 tools/verify_apk_cert.py "$APK_DIST" --expect "$CERT_SHA256"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GitHub Android Client ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.apk
            dist/*.sha256
            dist/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
