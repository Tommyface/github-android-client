name: Nightly

# 每夜回归：不阻塞当日合并，但失败必须有人处理（否则等同于没有）。
# 内容：
#  - Maestro 端到端冒烟（场景存在时执行；仓库当前无 .maestro 场景，见 M4-10）
#  - 安装 + 冷启动冒烟（无场景时也必须有真实可验证的产出，不允许"绿灯但什么都没跑"）
#  - UI 审计棘轮（P-200 方法学，失败即任务失败）
#
# 2026-11-28 修复（v0.19.1 起）：
#  1. `adb: command not found`：sdkmanager 装的 platform-tools 不在 runner 的 PATH 里，
#     显式追加 $ANDROID_HOME/platform-tools 与 $ANDROID_HOME/emulator 到 $GITHUB_PATH。
#  2. 原流程直接 `adb install`，但整个 job 没有任何设备/模拟器准备步骤——即便 adb 可用也无处可装。
#     改用 emulator-runner 起 AVD 后在其内部执行安装、冒烟与 Maestro。
#  3. UI 审计改为 `if: always()`：设备环节失败时也要跑，避免"审计根本没执行却没人发现"。
#  4. 第三次实测（#46059928520）暴露宿主硬限制：GitHub hosted runner 无 /dev/kvm，
#     emulator 37.x 拒绝 `-accel off`（日志原文：Software CPU emulation (-accel off) is not supported）。
#     因此设备环节改为**条件执行**：有 KVM 才跑模拟器；无 KVM 时显式跳过并在 job summary 写明原因与替代路径，
#     而不是每夜假红（假红与被忽略的红一样有害）。

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: maestro (端到端冒烟)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # 修复点 1：把 adb / emulator 显式放进 PATH（runner 默认不一定有）
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: 检测硬件加速（KVM）
        id: kvm
        run: |
          if [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::/dev/kvm 可用，执行设备环节"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::宿主无 /dev/kvm（GitHub hosted runner 常见），模拟器无法启动，跳过设备环节"
          fi
      - name: 模拟器内安装并冒烟
        # 修复点 4：仅在有 KVM 时执行；无 KVM 时 emulator 会以 -accel off 启动并直接报错
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            if [ -d .maestro ] && [ -n "$(ls -A .maestro 2>/dev/null)" ]; then
              curl -Ls "https://get.maestro.mobile.dev" | bash
              "$HOME/.maestro/bin/maestro" test .maestro
            else
              echo "::warning::仓库内尚无 .maestro 场景（M4-10 未落地），本次跳过场景执行，只做安装 + 冷启动冒烟"
            fi
            # 冷启动冒烟：进程必须真的起来。无场景时这是唯一有意义的端到端证据。
            adb shell monkey -p com.gy.githubclient -c android.intent.category.LAUNCHER 1
            sleep 5
            PID=$(adb shell pidof com.gy.githubclient | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "::error::冷启动后进程未存活（安装或启动失败）"
              adb logcat -d -t 200 | tail -80
              exit 1
            fi
            echo "::notice::冷启动冒烟通过，pid=$PID"
            adb shell am force-stop com.gy.githubclient
      - name: 设备环节不可用声明（写入 job summary）
        if: steps.kvm.outputs.available != 'true'
        run: |
          {
            echo "## 设备环节未执行：宿主无 KVM"
            echo ""
            echo "GitHub hosted ubuntu runner 不提供 \`/dev/kvm\`，emulator 37.x 拒绝软件 CPU 模拟"
            echo "（日志原文：\`Software CPU emulation (-accel off) is not supported\`）。"
            echo ""
            echo "本次实际执行：构建 Debug APK（通过）、UI 审计棘轮（通过）；"
            echo "端到端设备冒烟与 Maestro 场景**未执行**。"
            echo ""
            echo "替代路径：① 自托管 runner（挂 KVM）；② Maestro Cloud / Firebase Test Lab 上传 APK 跑；"
            echo "③ 本地真机（\`adb install -r app-debug.apk\`）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: UI 审计（P-200 方法学 · R7 起为真棘轮，失败即任务失败）
        # 旧写法用 `|| true` + warning，等于"审计失败也不影响任何事"——
        # 这类假门禁与 max=999 的阈值是同一类问题。nightly 不阻塞当日合并，
        # 但失败必须让任务变红，否则没人会看。
        if: always()
        run: bash tools/ui_audit.sh --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: |
            ~/.maestro/tests/**/*.xml
            preview/
          retention-days: 14
