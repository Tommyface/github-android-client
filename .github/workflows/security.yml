name: Security

# 供应链与密钥安全扫描（门禁 9/10/11）：
#  - OSV-Scanner：依赖漏洞，0 个 high/critical 未豁免
#  - gitleaks：密钥泄漏，0 命中
#  - Gradle verification-metadata：依赖版本锁定校验

on:
  schedule:
    - cron: '17 3 * * 1'   # 每周一 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: osv (依赖漏洞)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 OSV-Scanner
        run: |
          curl -sSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64"
          chmod +x osv-scanner
      - name: 扫描依赖清单
        run: |
          set -euo pipefail
          # 扫描 Gradle 依赖锁文件与源码中的已知漏洞
          ./osv-scanner scan source -r . --exclude "**/build/**" \
            --exclude "**/.gradle/**" --exclude "**/preview/**" \
            --format json > osv-report.json || true
          ./osv-scanner scan source -r . --exclude "**/build/**" --exclude "**/.gradle/**"
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-report
          path: osv-report.json
          retention-days: 30

  gitleaks:
    name: gitleaks (密钥泄漏)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 扫描
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          # 已知例外：app/debug.keystore 是故意入库的调试密钥（公开口令、仅用于内部覆盖安装），
          # 正式分发一律使用 CI Secrets 还原的 release 密钥（见 M0-06）。
          ./gitleaks detect --source . --no-banner --redact \
            --config .gitleaks.toml

  dependency-verification:
    name: gradle dependency verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 校验依赖锁定
        run: |
          if [ ! -f gradle/verification-metadata.xml ]; then
            echo "::notice::尚未提交 gradle/verification-metadata.xml（门禁 11 待启用）"
            exit 0
          fi
          ./gradlew --write-verification-metadata sha256 help > /dev/null
          git diff --exit-code gradle/verification-metadata.xml \
            || { echo "::error::依赖校验元数据与实际解析结果不一致"; exit 1; }

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 生成 SBOM
        run: |
          set -euo pipefail
          curl -sSL -o cyclonedx \
            "https://github.com/CycloneDX/cyclonedx-gradle-plugin/releases/download/v1.9.0/cyclonedx-gradle-plugin.jar"
          ./gradlew cyclonedxBom --saveBom sbom.json || echo "::notice::SBOM 生成失败（可选门禁）"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
