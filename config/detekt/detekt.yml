build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false

complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    active: false

naming:
  FunctionNaming:
    # Compose 可组合函数按惯例大写开头
    ignoreAnnotated: ["Composable"]
  MatchingDeclarationName:
    active: false

exceptions:
  SwallowedException:
    active: false

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
