org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 版本单一真源（M0-01）：所有版本号只在此处定义一次。
# 构建脚本、BuildConfig、CI 三处一致校验、version.json 全部读取本处。
# 规则：versionCode 严格递增且永不回退（Android 禁止降级安装）。
# 下一版跳过 v0.18.0 —— 该 tag 已被 ghhub 壳工程占用，见 spec/parity/PARITY-NOTICE.md。
ghcVersionName=0.19.0
ghcVersionCode=21

# 覆盖率阈值（门禁 5）。kover 内建 rule 未配置时该门禁形同虚设，
# 因此阈值以脚本方式强制：tools/check_coverage.py 读取本值并 fail。
# 当前实际覆盖率低于该值时，应先补测试而不是调高阈值。
ghcCoverageThreshold=60

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableBuildConfigValueDsl=false

kotlin.code.style=official
kotlin.incremental=true
